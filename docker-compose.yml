version: '3.9'

services:
  mongodb:
    image: mongo:7.0
    container_name: kaz_crm_mongodb
    restart: unless-stopped
    ports:
      - '27017:27017'
    environment:
      MONGO_INITDB_DATABASE: kaz_crm
    volumes:
      - mongodb_data:/data/db
    networks:
      - kaz_crm_network

  backend:
    build:
      context: ./backend
      dockerfile: ../Dockerfile.backend
    container_name: kaz_crm_backend
    restart: unless-stopped
    ports:
      - '5000:5000'
    depends_on:
      - mongodb
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGODB_URI: mongodb://mongodb:27017/kaz_crm
      JWT_SECRET: ${JWT_SECRET:-kaz_crm_jwt_secret_key_2024}
      JWT_EXPIRES_IN: 7d
      CORS_ORIGIN: http://localhost:3000
    networks:
      - kaz_crm_network

  frontend:
    build:
      context: ./frontend
      dockerfile: ../Dockerfile.frontend
    container_name: kaz_crm_frontend
    restart: unless-stopped
    ports:
      - '3000:80'
    depends_on:
      - backend
    environment:
      VITE_API_URL: http://backend:5000/api
    networks:
      - kaz_crm_network

networks:
  kaz_crm_network:
    driver: bridge

volumes:
  mongodb_data:
